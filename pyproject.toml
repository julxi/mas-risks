# One shared environment for all code in this repository, so that both
# researchers run the model organisms and the simulations on identical library
# versions (one pyproject at the repo root, packages under src/; see
# docs/CODING.md, section "Project Structure").
#
# This file lists direct dependencies only, with lower bounds only where a
# feature we rely on needs them. Exact versions live in uv.lock, which is what
# makes a run reproducible. requirements.txt is generated from uv.lock for
# people who use plain pip; never edit it by hand. How to install and how to
# change dependencies: README.md, section "Environment".

[project]
name = "mas-risks"
version = "0.1.0"
description = "Small open-weight agents with controlled susceptibility to influence, run in multi-agent risk scenarios."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    # Models, steering and LoRA training
    "torch",
    "transformers>=4.51",  # first release that loads Qwen3 checkpoints
    "accelerate",
    "peft",
    "bitsandbytes; sys_platform == 'linux'",  # 4-bit loading for QLoRA; needs an NVIDIA GPU
    "safetensors",
    "huggingface-hub",
    "datasets",
    # Analysis of the logged runs
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "matplotlib",
    # Simulations (mas_sim, risk_experiments)
    "openai>=3.58.0",  # client for OpenAI, Mistral and local vLLM/Ollama endpoints
    "pyyaml>=6.0.4",  # scenario files
    # Plumbing
    "pydantic>=2.14.4",  # validates the agents' JSON outputs
    "python-dotenv>=1.2.4",  # reads keys such as HF_TOKEN from .env
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One distribution, several import packages under src/. The project name
# (mas-risks) matches none of them, so hatchling must be told which to ship.
# Add every new package under src/ here, or it will not be importable.
[tool.hatch.build.targets.wheel]
packages = ["src/mas_sim", "src/risk_experiments"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

# Checks run by `make check` (see Makefile and docs/CODING.md § Additional instructions).
[tool.ruff]
# 120, not ruff's default 88: the code was written to ~120 columns, and long assert
# messages read better on one line.
line-length = 120
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# B905 (zip without strict=) is the rule that matters most here: a silent zip
# truncation would violate the repo's fail-loudly rule.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# No docstring rules (D): they push toward "what" docstrings on every function,
# against docs/CODING.md's "comments say why, not what".

[tool.pyright]
include = ["src", "scripts", "tests"]
venvPath = "."
venv = ".venv"
# basic, not strict: strict would require annotating every test helper.
typeCheckingMode = "basic"
